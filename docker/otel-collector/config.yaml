exporters:
  otlp/tui:
    endpoint: otel-tui:4317
    tls:
      insecure: true
  debug:
    verbosity: detailed
  debug/2:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  batch:
    send_batch_max_size: 1000
    send_batch_size: 100
    timeout: 2s
  memory_limiter:
    check_interval: 1s
    limit_mib: 1000

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_GRPC}
      http:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_HTTP}
        cors:
          allowed_origins:
            - "http://*"
            - "https://*"

service:
  extensions:
    - health_check
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [debug, otlp/tui]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug/2, otlp/tui]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp/tui]
